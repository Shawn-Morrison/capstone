
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#414833">
    <title>My Collection | License Plate Scavenger Hunt</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./js/collection.js"></script>
</head>
<body class="app-page">

    <main class="page-shell collection-page">

        <header class="collection-hero">
            <p class="eyebrow light-eyebrow">PLATE PASSPORT</p>
            <h1><span id="collection-player-name">Explorer</span>'s Collection</h1>
            <div class="collection-summary">
                <div><strong id="collection-state-count">0</strong><span>STATES FOUND</span></div>
                <div><strong id="collection-points">0</strong><span>TOTAL POINTS</span></div>
            </div>
        </header>

        <section class="collection-body">
            <div class="collection-progress-heading">
                <strong>United States</strong>
                <span id="collection-progress-label">0 of 50</span>
            </div>
            <div class="mini-progress collection-progress-bar">
                <div id="collection-progress-fill"></div>
            </div>

            <div id="collection-state-list" class="collection-state-list"></div>

            <p class="collection-note">
                Keep exploring! More state plates will be added as the adventure grows.
            </p>
        </section>

    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
        <a href="./game.html" class="nav-item">
            <span class="nav-icon">⌂</span><span>Trail</span>
        </a>
        <a href="./collection.html" class="nav-item active">
            <span class="nav-icon">▤</span><span>Collection</span>
        </a>
        <a href="./leaderboard.html" class="nav-item">
            <span class="nav-icon">♜</span><span>Leaders</span>
        </a>
        <a href="./players.html" class="nav-item">
            <span class="nav-icon">♙</span><span>Players</span>
        </a>
    </nav>

</body>
</html>
