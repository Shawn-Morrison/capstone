
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#333d29">
    <title>License Plate Scavenger Hunt</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./js/app.js"></script>
</head>
<body class="landing-page">

    <main class="landing-content">
        <div class="landing-brand">
            <div class="brand-mark">50</div>
            <p class="eyebrow">THE GREAT AMERICAN</p>
            <h1>License Plate<br>Scavenger Hunt</h1>
            <p class="landing-tagline">
                Explore more. Discover more. Collect them all.
            </p>
        </div>

        <div class="mountain-art" aria-hidden="true">
            <div class="mountain mountain-back"></div>
            <div class="mountain mountain-front"></div>
            <div class="tree-line">♠　♠　♠　♠　♠　♠</div>
        </div>

        <div class="landing-actions">
            <a href="./players.html" class="btn btn-primary">
                Start Your Adventure
                <span aria-hidden="true">→</span>
            </a>

            <a href="./leaderboard.html" class="btn btn-outline-light">
                View Leaderboard
            </a>
        </div>

        <p id="welcome-player" class="landing-returning"></p>

        <p class="landing-footer">A FAMILY ROAD TRIP ADVENTURE</p>
    </main>

</body>
</html>
